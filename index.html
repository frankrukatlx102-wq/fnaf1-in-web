const SAVE_SECRET = "M4L3R_D4RK_S3CR3T_P1ZZ4_HMAC_K3Y_X992";

function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j, result = '', words = [];
  var asciiBitLength = ascii[lengthProperty] * 8, hash = [], k = [], primeCounter = 0, isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return;
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var s0 = rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3);
      var s1 = rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10);
      var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
      var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
      var temp1 = hash[7] + (rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25)) + ch + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + s0 + w[i - 7] + s1) | 0);
      var temp2 = (rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22)) + maj;
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

function hexToBin(hex) {
  var bin = '';
  for (var i = 0; i < hex.length; i += 2) bin += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
  return bin;
}

function hmacSha256(key, message) {
  var blockSize = 64;
  if (key.length > blockSize) key = hexToBin(sha256(key));
  while (key.length < blockSize) key += '\x00';
  var oKeyPad = '', iKeyPad = '';
  for (var i = 0; i < blockSize; i++) {
    oKeyPad += String.fromCharCode(key.charCodeAt(i) ^ 0x5c);
    iKeyPad += String.fromCharCode(key.charCodeAt(i) ^ 0x36);
  }
  var innerHashBin = hexToBin(sha256(iKeyPad + message));
  return sha256(oKeyPad + innerHashBin);
}

function computeSaveChecksum(night, stars) {
  return (night * 31337 + stars * 7919) ^ 0xCAFEBABE;
}

function createVaultSave(night, stars, customUnlocked) {
  const nonce = Math.random().toString(36).substring(2, 12) + Math.random().toString(36).substring(2, 12);
  const n = parseInt(night) || 1;
  const s = parseInt(stars) || 0;
  const cu = !!customUnlocked;
  const chk = computeSaveChecksum(n, s);
  const payload = {
    app: "FiveNightsAtMaler",
    version: "2.0",
    night: n,
    stars: s,
    customUnlocked: cu,
    timestamp: new Date().toISOString(),
    nonce: nonce,
    checksum: chk
  };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const sig = hmacSha256(SAVE_SECRET, SAVE_SALT + ":" + b64 + ":" + nonce);
  return [
    "-----BEGIN FAZBEAR SECURE VAULT-----",
    "FORMAT: FCV-2.0-HMAC-SHA256",
    "NONCE: " + nonce,
    "DATA: " + b64,
    "SIGNATURE: " + sig,
    "-----END FAZBEAR SECURE VAULT-----"
  ].join("\n");
}

function verifyVaultSave(vaultStr) {
  if (!vaultStr || typeof vaultStr !== 'string') return { valid: false, reason: "EMPTY_OR_NON_STRING" };
  if (!vaultStr.includes("-----BEGIN FAZBEAR SECURE VAULT-----")) {
    return { valid: false, reason: "INVALID_HEADER_NON_SECURE_FORMAT" };
  }
  const lines = vaultStr.trim().split("\n");
  let nonce = "", b64 = "", sig = "";
  for (const line of lines) {
    const l = line.trim();
    if (l.startsWith("NONCE: ")) nonce = l.substring(7).trim();
    if (l.startsWith("DATA: ")) b64 = l.substring(6).trim();
    if (l.startsWith("SIGNATURE: ")) sig = l.substring(11).trim();
  }
  if (!nonce || !b64 || !sig) {
    return { valid: false, reason: "MISSING_CRYPTOGRAPHIC_FIELDS" };
  }
  const expectedSig = hmacSha256(SAVE_SECRET, SAVE_SALT + ":" + b64 + ":" + nonce);
  if (expectedSig.toLowerCase() !== sig.toLowerCase()) {
    return { valid: false, reason: "TAMPER_DETECTED_HMAC_SIGNATURE_MISMATCH" };
  }
  try {
    const jsonStr = decodeURIComponent(escape(atob(b64)));
    const obj = JSON.parse(jsonStr);
    const expectedChk = computeSaveChecksum(obj.night, obj.stars || 0);
    if (obj.checksum !== expectedChk) {
      return { valid: false, reason: "CHECKSUM_INTEGRITY_COMPROMISED" };
    }
    return { valid: true, data: obj };
  } catch (e) {
    return { valid: false, reason: "PAYLOAD_DECODING_ERROR" };
  }
}

function loadGameSave() {

  const res = verifyVaultSave(stored);

    console.warn("[FAZBEAR SECURITY] Save verification failed:", res.reason);
    console.warn("[FAZBEAR SECURITY] Tampering detected! Progress reset to Night 1.");
    saveGameProgress(1, 0, false);
    return { night: 1, stars: 0, customUnlocked: false, tampered: true };
  }
  return res.data;
}

  return items;

function getCameraFeedImage() {
  const malerAt = (r) => {
    if (r === '1A') return G.maler.pos === 1;
    if (r === '1B') return G.maler.pos === 2;
    if (r === '7')  return G.maler.pos === 3;
    if (r === '6')  return G.maler.pos === 4;
    if (r === '4A') return G.maler.pos === 5;
    if (r === '4B') return G.maler.pos === 6;
    return false;
  };

  const karkasAt = (r) => {
    if (r === '1A') return G.karkas.pos === 1;
    if (r === '1B') return G.karkas.pos === 2;
    if (r === '5')  return G.karkas.pos === 3;
    if (r === '2A') return G.karkas.pos === 4;
    if (r === '3')  return G.karkas.pos === 5;
    if (r === '2B') return G.karkas.pos === 6;
    return false;
  };

  const plagueAt = (r) => {
    if (r === '1A') return G.plague.pos === 1;
    if (r === '1B') return G.plague.pos === 2;
    if (r === '7')  return G.plague.pos === 3;
    if (r === '6')  return G.plague.pos === 4;
    if (r === '4A') return G.plague.pos === 5;
    if (r === '4B') return G.plague.pos === 6;
    return false;
  };

  const cam = G.selectedCam;

  // CAM 1A: Show Stage
  if (cam === '1A') {
    const k = karkasAt('1A'), p = plagueAt('1A'), m = malerAt('1A');
    if (k && p && m) return images['stage-b-c-f'];
    if (p && m) return images['stage-c-f'];
    if (k && m) return images['stage-b-f'];
    if (m) return images['stage-f'];
    return images['stage'];
  }

  // CAM 1B: Dining Area
  if (cam === '1B') {
    const k = karkasAt('1B'), p = plagueAt('1B'), m = malerAt('1B');
    if (k && p && m) return images['dinningarea-b-c-f'];
    if (k && p) return images['dinningarea-b-c'];
    if (k && m) return images['dinningarea-b-f'];
    if (p && m) return images['dinningarea-c-f'];
    if (k) return images['dinningarea-b'];
    if (p) return images['dinningarea-c'];
    if (m) return images['dinningarea-f'];
    return images['dinningarea'];
  }

  // CAM 1C: Pirate Cove
  if (cam === '1C') {
    if (G.dash.stage === 1) return images['pirate_cove'];
    if (G.dash.stage === 2) return images['pirate_cove-1'];
    if (G.dash.stage === 3) return images['pirate_cove-2'];
    if (G.pirateCoveItsMe && images['pirate_cove_itsme']) {
      return images['pirate_cove_itsme'];
    }
    return images['pirate_cove-3'];
  }

  // CAM 2A: West Hall
  if (cam === '2A') {
    if (G.dash.stage === 4) {
      if (G.dash.sprintTimer < 1.6) {
        const idx = Math.min(7, Math.floor((G.dash.sprintTimer / 1.6) * 8));
        return images['dash_run_' + idx];
      }
      return images['west_hall'];
    }
    if (karkasAt('2A')) return images['west_hall-b'];
    return images['west_hall'];
  }

  // CAM 2B: West Hall Corner (Right outside left door)
  if (cam === '2B') {
    if (karkasAt('2B')) return images['whallcorner-b'];
    if (G.cam2bGoldenPoster && images['golden_freddy_face']) {
      return images['golden_freddy_face'];
    }
    return images['whallcorner'];
  }

  // CAM 3: Supply Closet
  if (cam === '3') {
    if (karkasAt('3')) return images['supplyroom-b'];
    return images['supplyroom'];
  }

  // CAM 4A: East Hall
  if (cam === '4A') {
    const p = plagueAt('4A'), m = malerAt('4A');
    if (p && m) return images['east_hall-c-f'];
    if (p) return images['east_hall-c'];
    if (m) return images['east_hall-f'];
    if (G.cam4aItsMe && images['east_hall_itsme']) {
      return images['east_hall_itsme'];
    }
    return images['east_hall_normal'] || images['east_hall'];
  }

  // CAM 4B: East Hall Corner (Right outside right door)
  if (cam === '4B') {
    if (plagueAt('4B')) return images['ehallcorner-c'];
    if (malerAt('4B')) return images['ehallcorner-f'];
    if (G.cam4bEasterEgg && images['ehallcorner_news' + G.cam4bEasterEgg]) {
      return images['ehallcorner_news' + G.cam4bEasterEgg];
    }
    return images['ehallcorner_rules'] || images['ehallcorner'];
  }

  // CAM 5: Backstage
  if (cam === '5') {
    if (karkasAt('5')) {
      if (G.bonnieStareCam5 && images['backstage_bonnie_stare']) {
        return images['backstage_bonnie_stare'];
      }
      return images['backstage-b'];
    }
    if (G.backstageHeadsStare && images['backstage_heads_stare']) {
      return images['backstage_heads_stare'];
    }
    return images['backstage'];
  }

  // CAM 6: Kitchen (Audio Only)
  if (cam === '6') {
    return images['cam_6_kitchen'];
  }

  // CAM 7: Restrooms
  if (cam === '7') {
    const p = plagueAt('7'), m = malerAt('7');
    if (p && m) return images['restrooms-c-f'];
    if (p) return images['restrooms-c'];
    if (m) return images['restrooms-f'];
    return images['restrooms'];
  }

  return images['stage-b-c-f'];
}

document.addEventListener('keydown', (e) => {
  const char = e.key.toUpperCase();
  if (char.length === 1 && char >= 'A' && char <= 'Z') {
    G.keyBuffer += char;
    if (G.keyBuffer.length > 30) G.keyBuffer = G.keyBuffer.substring(G.keyBuffer.length - 30);
  }

  // In-Night Cheat Panel Toggle ('C' key or 'Escape' to close)
  if ((e.code === 'KeyC' || e.key === 'c' || e.key === 'C') && G.gameState === 'playing' && !G.gameOver && !G.nightWon) {
    G.nightCheatPanelOpen = !G.nightCheatPanelOpen;
    playSound('switch_click');
    return;
  }
  if (e.code === 'Escape' && G.nightCheatPanelOpen) {
    G.nightCheatPanelOpen = false;
    playSound('switch_click');
    return;
  }

  // --- CHEAT CODES REGISTRY (Silent Activation) ---
  // 1. IAMHERE: Golden Freddy Callout
  if (G.keyBuffer.endsWith('IAMHERE')) {
    G.keyBuffer = '';
    G.entity5.active = true;
    G.entity5.timer = 0;
    playSound('windowscare');
    triggerHallucinationFlash();
    return;
  }

  // 2. SKIPNIGHT or CD+: Skip Night to 6:00 AM
  if (G.keyBuffer.endsWith('SKIPNIGHT') || e.code === 'NumpadAdd' && (e.ctrlKey || G.keyBuffer.endsWith('CD'))) {
    G.keyBuffer = '';
    G.hour = 6;
    G.nightWon = true;
    G.gameState = 'win';
    G.winTimer = 0;
    stopAllShiftSounds();
    playSound('win');
    return;
  }

  // 3. INFPOWER: Infinite Battery Toggle
  if (G.keyBuffer.endsWith('INFPOWER')) {
    G.keyBuffer = '';
    G.infinitePower = !G.infinitePower;
    if (G.infinitePower) G.power = 100.0;
    return;
  }

  // 4. FASTNIGHT: Fast Time Progression
  if (G.keyBuffer.endsWith('FASTNIGHT')) {
    G.keyBuffer = '';
    G.fastNight = !G.fastNight;
    return;
  }

  // 5. AGGRESSIVE: 20/20/20/20 Challenge Mode
  if (G.keyBuffer.endsWith('AGGRESSIVE')) {
    G.keyBuffer = '';
    G.maler.level = 20;
    G.karkas.level = 20;
    G.plague.level = 20;
    G.dash.level = 20;
    return;
  }

  // 6. PACIFIST: All AI to 0
  if (G.keyBuffer.endsWith('PACIFIST')) {
    G.keyBuffer = '';
    G.maler.level = 0;
    G.karkas.level = 0;
    G.plague.level = 0;
    G.dash.level = 0;
    return;
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  G.mouseX = (e.clientX - rect.left) * (1920 / rect.width);
  G.mouseY = (e.clientY - rect.top) * (1080 / rect.height);

  if (sounds.menu_music.paused && G.gameState === 'menu') {
    sounds.menu_music.play().catch(()=>{});
  }

  // Menu Selection Hover
  if (G.gameState === 'menu') {
    const items = getAvailableMenuItems();
    if (G.mouseX > 120 && G.mouseX < 540) {
      for (let idx = 0; idx < items.length; idx++) {
        const topY = 620 + idx * 75;
        if (G.mouseY >= topY && G.mouseY <= topY + 65) {
          if (G.selectedMenuOption !== idx) {
            playSound('switch_click');
            G.selectedMenuOption = idx;
          }
          break;
        }
      }
    }
  }

  // In-Game Monitor Hover Trigger (Chevron Bar at Bottom)
  if (G.gameState === 'playing' && !G.gameOver && !G.nightWon && !G.blackout) {
    const now = performance.now();
    if (G.mouseY > 990 && G.mouseX > 660 && G.mouseX < 1260) {
      if (now - G.lastFlipToggleTime > 420) {
        G.lastFlipToggleTime = now;
        toggleMonitor();
      }
    }
  }
});

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (1920 / rect.width);
  const my = (e.clientY - rect.top) * (1080 / rect.height);
  G.mouseX = mx;
  G.mouseY = my;

  // 1. MAIN MENU CLICKS
  if (G.gameState === 'menu') {
    sounds.menu_music.play().catch(()=>{});
    const items = getAvailableMenuItems();
    if (mx > 120 && mx < 540) {
      for (let idx = 0; idx < items.length; idx++) {
        const topY = 620 + idx * 75;
        if (my >= topY && my <= topY + 65) {
          const item = items[idx];
          if (item.id === 'new_game') {
            G.currentNight = 1;
            saveGameProgress(1, G.saveData.stars, G.saveData.customUnlocked);
            startShiftIntro();
            return;
          } else if (item.id === 'continue') {
            G.currentNight = Math.min(5, G.saveData.night || 1);
            startShiftIntro();
            return;
          } else if (item.id === 'night_6') {
            G.currentNight = 6;
            startShiftIntro();
            return;
          } else if (item.id === 'custom_night') {
            playSound('switch_click');
            G.gameState = 'custom_night';
            return;
          } else if (item.id === 'extra') {
            playSound('switch_click');
            G.gameState = 'extra';
            G.extraTab = 'roster';
            return;
          }
        }
      }
    }
    return;
  }

  // 2. CUSTOM NIGHT (NIGHT 7) CLICKS
  if (G.gameState === 'custom_night') {
    const animBoxes = [
      { key: 'maler',  x: 140 },
      { key: 'karkas', x: 540 },
      { key: 'plague', x: 940 },
      { key: 'dash',   x: 1340 }
    ];

    for (const b of animBoxes) {
      // Left arrow: x + 40, y: 560..620
      if (mx >= b.x + 35 && mx <= b.x + 95 && my >= 560 && my <= 620) {
        G.customAI[b.key] = Math.max(0, G.customAI[b.key] - 1);
        playSound('switch_click');
        return;
      }
      // Right arrow: x + 245, y: 560..620
      if (mx >= b.x + 245 && mx <= b.x + 305 && my >= 560 && my <= 620) {
        G.customAI[b.key] = Math.min(20, G.customAI[b.key] + 1);
        playSound('switch_click');
        return;
      }
    }

    // Presets
    // 20/20/20/20
    if (mx >= 140 && mx <= 400 && my >= 760 && my <= 820) {
      G.customAI.maler = 20; G.customAI.karkas = 20; G.customAI.plague = 20; G.customAI.dash = 20;
      playSound('switch_click');
      return;
    }
    // 10/10/10/10
    if (mx >= 440 && mx <= 700 && my >= 760 && my <= 820) {
      G.customAI.maler = 10; G.customAI.karkas = 10; G.customAI.plague = 10; G.customAI.dash = 10;
      playSound('switch_click');
      return;
    }
    // 5/5/5/5
    if (mx >= 740 && mx <= 1000 && my >= 760 && my <= 820) {
      G.customAI.maler = 5; G.customAI.karkas = 5; G.customAI.plague = 5; G.customAI.dash = 5;
      playSound('switch_click');
      return;
    }
    // 0/0/0/0
    if (mx >= 1040 && mx <= 1300 && my >= 760 && my <= 820) {
      G.customAI.maler = 0; G.customAI.karkas = 0; G.customAI.plague = 0; G.customAI.dash = 0;
      playSound('switch_click');
      return;
    }

    // READY / START NIGHT
    if (mx >= 1380 && mx <= 1740 && my >= 740 && my <= 830) {
      // 1-9-8-7 Easter Egg: CRASHES THE GAME!
      if (G.customAI.maler === 1 && G.customAI.karkas === 9 && G.customAI.plague === 8 && G.customAI.dash === 7) {
        G.is1987Crash = true;
        triggerJumpscare('entity5', 'Golden Freddy (1-9-8-7 Fatal Crash Code)');
        return;
      }
      G.currentNight = 7;
      startShiftIntro();
      return;
    }

    // BACK TO MENU
    if (mx >= 140 && mx <= 460 && my >= 880 && my <= 950) {
      resetToMenu();
      return;
    }
    return;
  }

  // 3. EXTRA MENU CLICKS
  if (G.gameState === 'extra') {
    // Back to Menu: (x: 1520, y: 50, w: 280, h: 55)
    if (mx >= 1520 && mx <= 1800 && my >= 50 && my <= 110) {
      resetToMenu();
      return;
    }

    // 6 Selector Buttons at y: 130..185 (0..4 Animatronics, 5 is Night Selector)
    for (let i = 0; i < 6; i++) {
      const bx = 120 + i * 280;
      if (mx >= bx && mx <= bx + 265 && my >= 130 && my <= 185) {
        G.extraSelectedAnim = i;
        playSound('switch_click');
        return;
      }
    }

    // If Night Selector tab (index 5) is active:
    if (G.extraSelectedAnim === 5) {
      // Row 1 (Nights 1 to 4)
      for (let i = 0; i < 4; i++) {
        const cardX = 140 + i * 420;
        const n = i + 1;
        if (mx >= cardX + 20 && mx <= cardX + 360 && my >= 500 && my <= 555) {
          G.currentNight = n;
          startShiftIntro();
          return;
        }
      }
      // Row 2 (Night 5, Night 6, Custom Night)
      const row2Nights = [5, 6, 7];
      for (let j = 0; j < 3; j++) {
        const cardX = 220 + j * 510;
        const n = row2Nights[j];
        if (mx >= cardX + 30 && mx <= cardX + 430 && my >= 880 && my <= 940) {
          if (n === 7) {
            G.gameState = 'custom_night';
            playSound('switch_click');
          } else {
            G.currentNight = n;
            startShiftIntro();
          }
          return;
        }
      }
      return;
    }

    // Play Signature Audio Button (x: 150, y: 920, w: 540, h: 65)
    if (mx >= 150 && mx <= 690 && my >= 920 && my <= 985) {
      if (G.extraSelectedAnim === 0) {
        playSound('maler_laugh');
      } else if (G.extraSelectedAnim === 1) {
        playSound('screamer');
      } else if (G.extraSelectedAnim === 2) {
        playSound('kitchen_rattle');
      } else if (G.extraSelectedAnim === 3) {
        playSound('dash_song');
      } else if (G.extraSelectedAnim === 4) {
        playSound('golden_freddy_scream');
      }
      return;
    }
    return;
  }

  // 4. GAME CRASH / OVER / WIN RESTART CLICKS
  if (G.gameState === 'crashed') {
    window.location.reload();
    return;
  }
  if (G.gameState === 'win') {
    if (G.winTimer >= 3.8) {
      completeWinNight();
    }
    return;
  }
  if (G.gameState === 'gameover') {
    const minClickSkip = (G.jumpscareType === 'entity5') ? 9.35 : 1.2;
    if (G.jumpscareTimer >= minClickSkip) {
      resetToMenu();
    }
    return;
  }

  // 5. PLAYING IN-GAME CLICKS
  if (G.gameState === 'playing') {
    if (G.gameOver || G.nightWon) return;

    // --- NEVERLOSE-STYLE IN-NIGHT CHEAT ENGINE PANEL INTERACTION ---
    if (G.nightCheatPanelOpen) {
      // Top-right close button [X] (x: 1490..1540, y: 105..145)
      if (mx >= 1490 && mx <= 1540 && my >= 105 && my <= 145) {
        G.nightCheatPanelOpen = false;
        playSound('switch_click');
        return;
      }
      // Bottom close button (x: 660..1260, y: 865..915)
      if (mx >= 660 && mx <= 1260 && my >= 865 && my <= 915) {
        G.nightCheatPanelOpen = false;
        playSound('switch_click');
        return;
      }
      // Click outside modal closes it
      if (mx < 360 || mx > 1560 || my < 90 || my > 930) {
        G.nightCheatPanelOpen = false;
        playSound('switch_click');
        return;
      }

      // Tab bar navigation at y: 165..215
      if (my >= 165 && my <= 215) {
        if (mx >= 380 && mx <= 660) { G.neverloseTab = 0; playSound('switch_click'); return; }
        if (mx >= 670 && mx <= 950) { G.neverloseTab = 1; playSound('switch_click'); return; }
        if (mx >= 960 && mx <= 1240) { G.neverloseTab = 2; playSound('switch_click'); return; }
        if (mx >= 1250 && mx <= 1530) { G.neverloseTab = 3; playSound('switch_click'); return; }
      }

      // TAB 0: AIMBOT / A.I. ENGINE
      if (G.neverloseTab === 0) {
        // Maler level [-] / [+]
        if (my >= 300 && my <= 350) {
          if (mx >= 780 && mx <= 830) { G.maler.level = Math.max(0, G.maler.level - 1); playSound('switch_click'); return; }
          if (mx >= 850 && mx <= 900) { G.maler.level = Math.min(20, G.maler.level + 1); playSound('switch_click'); return; }
        }
        // Karkas level [-] / [+]
        if (my >= 370 && my <= 420) {
          if (mx >= 780 && mx <= 830) { G.karkas.level = Math.max(0, G.karkas.level - 1); playSound('switch_click'); return; }
          if (mx >= 850 && mx <= 900) { G.karkas.level = Math.min(20, G.karkas.level + 1); playSound('switch_click'); return; }
        }
        // Plague level [-] / [+]
        if (my >= 440 && my <= 490) {
          if (mx >= 780 && mx <= 830) { G.plague.level = Math.max(0, G.plague.level - 1); playSound('switch_click'); return; }
          if (mx >= 850 && mx <= 900) { G.plague.level = Math.min(20, G.plague.level + 1); playSound('switch_click'); return; }
        }
        // Dash level [-] / [+]
        if (my >= 510 && my <= 560) {
          if (mx >= 780 && mx <= 830) { G.dash.level = Math.max(0, G.dash.level - 1); playSound('switch_click'); return; }
          if (mx >= 850 && mx <= 900) { G.dash.level = Math.min(20, G.dash.level + 1); playSound('switch_click'); return; }
        }

        // Right box presets
        if (mx >= 990 && mx <= 1490) {
          if (my >= 300 && my <= 355) {
            G.maler.level = 20; G.karkas.level = 20; G.plague.level = 20; G.dash.level = 20;
            playSound('switch_click'); return;
          }
          if (my >= 370 && my <= 425) {
            G.maler.level = 10; G.karkas.level = 10; G.plague.level = 10; G.dash.level = 10;
            playSound('switch_click'); return;
          }
          if (my >= 440 && my <= 495) {
            G.maler.level = 0; G.karkas.level = 0; G.plague.level = 0; G.dash.level = 0;
            playSound('switch_click'); return;
          }
          if (my >= 510 && my <= 565) {

// Authentic FNaF 1 Movement Opportunity check with global cooldown & Below-15 AI nerfed scaling
function checkMovementOpportunity(level) {
  if (level <= 0) return false;
  if (G.initialGraceTimer > 0) return false;
  if (G.globalMovementCooldown > 0) return false;

  // Below AI 15: intentionally reduced movement opportunity (nerfed progression rate)
  // For AI < 15: effective level is scaled down (e.g. AI 5 -> effective 2; AI 10 -> effective 4)
  // Rolling 1..20
  const effectiveLevel = (level < 15) ? Math.max(1, Math.floor(level * 0.40)) : level;
  const roll = Math.floor(Math.random() * 20) + 1;
  return roll <= effectiveLevel;
}

// Canonical Scott Cawthon AI Level Progression per Night & Hour (Balanced & Fair)
function updateAILevelsForHour() {
  const n = G.currentNight;
  const h = G.hour;

  if (n === 7) {
    // Custom Night: strictly uses user configured AI levels
    G.maler.level = G.customAI.maler;
    G.karkas.level = G.customAI.karkas;
    G.plague.level = G.customAI.plague;
    G.dash.level = G.customAI.dash;
    return;
  }

  if (n === 1) {
    // Night 1: Quiet tutorial night
    G.maler.level = 0;
    G.dash.level = 0;
    if (h < 3) {
      G.karkas.level = 0;
      G.plague.level = 0;
    } else if (h < 4) {
      G.karkas.level = 1;
      G.plague.level = 0;
    } else {
      G.karkas.level = 2;
      G.plague.level = 1;
    }
  } else if (n === 2) {
    // Night 2: Moderate paced, gentle introduction
    G.maler.level = 0;
    G.dash.level = (h >= 4) ? 2 : (h >= 3 ? 1 : 0);
    G.karkas.level = (h >= 4) ? 3 : (h >= 3 ? 2 : 1);
    G.plague.level = (h >= 4) ? 2 : (h >= 3 ? 1 : 0);
  } else if (n === 3) {
    // Night 3: Steady challenge, fair and balanced
    G.maler.level = (h >= 4) ? 1 : 0;
    G.dash.level = (h >= 4) ? 3 : (h >= 3 ? 2 : 1);
    G.karkas.level = (h >= 4) ? 3 : (h >= 3 ? 2 : 2);
    G.plague.level = (h >= 4) ? 3 : (h >= 3 ? 2 : 1);
  } else if (n === 4) {
    // Night 4: Tense, Freddy active
    G.maler.level = (h >= 4) ? 2 : (h >= 3 ? 1 : 1);
    G.dash.level = (h >= 4) ? 4 : (h >= 3 ? 3 : 2);
    G.karkas.level = (h >= 4) ? 5 : (h >= 3 ? 4 : 3);
    G.plague.level = (h >= 4) ? 5 : (h >= 3 ? 4 : 3);
  } else if (n === 5) {
    // Night 5: Challenging finale
    G.maler.level = (h >= 4) ? 4 : (h >= 3 ? 3 : 2);
    G.dash.level = (h >= 4) ? 6 : (h >= 3 ? 5 : 4);
    G.karkas.level = (h >= 4) ? 7 : (h >= 3 ? 6 : 5);
    G.plague.level = (h >= 4) ? 7 : (h >= 3 ? 6 : 5);
  } else {
    // Night 6: Nightmare Shift
    G.maler.level = (h >= 4) ? 5 : (h >= 2 ? 4 : 3);
    G.dash.level = (h >= 4) ? 7 : (h >= 2 ? 6 : 5);
    G.karkas.level = (h >= 4) ? 9 : (h >= 2 ? 7 : 6);
    G.plague.level = (h >= 4) ? 9 : (h >= 2 ? 7 : 6);
  }
}

function completeWinNight() {
  if (G.winProcessed) return;
  G.winProcessed = true;
  let currentN = G.currentNight;
  let curStars = G.saveData.stars || 0;
  let customUnl = G.saveData.customUnlocked || false;
  let nextN = G.saveData.night || 1;

  if (currentN === 5) {
    if (curStars < 1) curStars = 1;
    nextN = Math.max(nextN, 6);
  } else if (currentN === 6) {
    if (curStars < 2) curStars = 2;
    customUnl = true;
    nextN = Math.max(nextN, 7);
  } else if (currentN === 7) {
    if (curStars < 3) curStars = 3;
    customUnl = true;
  } else {
    nextN = Math.max(nextN, currentN + 1);
  }

  saveGameProgress(nextN, curStars, customUnl);
  G.saveData.night = nextN;
  G.saveData.stars = curStars;
  G.saveData.customUnlocked = customUnl;
  G.currentNight = nextN;
  resetToMenu();
}

// =========================================================================
// 7. GAME LOGIC UPDATE LOOP (SCOTT CAWTHON FUSION CADENCE)
// =========================================================================
function update(dt) {
  // 1. MAIN MENU LOGIC
  if (G.gameState === 'menu') {
    G.staticFrame = (Math.floor(performance.now() / 45) % 6) + 1;
    G.menuTwitchTimer += dt;

    if (!G.menuTwitchActive) {
      if (G.menuTwitchTimer > 2.0 + Math.random() * 2.5) {
        G.menuTwitchActive = true;
        G.menuTwitchTimer = 0;
        G.menuTwitchDuration = 0.08 + Math.random() * 0.12;
        G.menuFreddyFrame = Math.floor(Math.random() * 3) + 1;
      }
    } else {
      if (G.menuTwitchTimer > G.menuTwitchDuration) {
        G.menuTwitchActive = false;
        G.menuTwitchTimer = 0;
        G.menuFreddyFrame = 0;
      }
    }
    return;
  }

  // 2. SHIFT INTRO LOGIC (12:00 AM)
  if (G.gameState === 'shift_intro') {
    G.shiftIntroTimer += dt;
    if (G.shiftIntroTimer >= 2.5) {
      startShift();
    }
    return;
  }

  // 3. GAME OVER LOGIC (Authentic FNaF 1: Jumpscare -> Black Screen -> Return to Menu)
  if (G.gameState === 'gameover') {
    G.jumpscareTimer += dt;
    G.jumpscareFrame = Math.floor(G.jumpscareTimer * 20);
    if (G.is1987Crash && G.jumpscareTimer >= 2.0) {
      G.gameState = 'crashed';
      stopAllShiftSounds();
      try { window.close(); } catch(e){}
      return;
    }
    const maxDuration = (G.jumpscareType === 'entity5') ? 9.35 : 2.5;
    if (G.jumpscareTimer >= maxDuration) {
      resetToMenu();
    }
    return;
  }

  if (G.gameState === 'crashed') {
    return;
  }

  // 4. WIN LOGIC (Authentic FNaF 1: 5 AM -> 6 AM Chime -> Black Screen -> Auto-Save & Menu)
  if (G.gameState === 'win') {
    G.winTimer += dt;
    if (G.winTimer >= 5.0) {
      completeWinNight();
    }
    return;
  }

  // 5. IN-GAME UPDATE
  if (G.gameState !== 'playing') {
    return;
  }

  // Decrement global movement lockout and initial night grace timer
  if (G.globalMovementCooldown > 0) {
    G.globalMovementCooldown -= dt;
  }
  if (G.initialGraceTimer > 0) {
    G.initialGraceTimer -= dt;
  }

  if (G.cheatToastTimer > 0) {
    G.cheatToastTimer -= dt;
  }

  // Hallucination Flash Timer
  if (G.halluActive) {
    G.halluTimer -= dt;
    if (G.halluTimer <= 0) G.halluActive = false;
  } else {
    // Rare spontaneous ambient hallucination (significantly reduced rate)
    if (Math.random() < 0.00005) {
      triggerHallucinationFlash();
    }
  }

  // Phone Guy Call Sequencer (Nights 1 to 5) - Single non-looping playback
  if (G.phoneCallActive && !G.phoneCallMuted && !G.phoneCallEnded) {
    G.phoneCallTimer += dt;
    const curSound = sounds['phone_guy_' + G.currentNight];
    if (curSound && !G.phoneCallStarted) {
      if (G.phoneCallTimer >= 2.0) {
        G.phoneCallStarted = true;
        curSound.loop = false;
        curSound.currentTime = 0;
        curSound.onended = () => {
          G.phoneCallActive = false;
          G.phoneCallEnded = true;
        };
        curSound.play().catch(()=>{});
      }
    }
  }

  // Tablet Flip Animation (11 frames)
  if (G.tabletState === 'opening') {
    G.tabletFrame += dt * 38;
    if (G.tabletFrame >= 11) {
      G.tabletFrame = 11;
      G.tabletState = 'open';
      G.monitorOpen = true;
    }
  } else if (G.tabletState === 'closing') {
    G.tabletFrame -= dt * 38;
    if (G.tabletFrame <= 1) {
      G.tabletFrame = 1;
      G.tabletState = 'closed';
      G.monitorOpen = false;
    }
  }

  // Door Animation Transitions (16 frames)
  if (G.doorLeftClosed && G.doorLeftFrame < 15) {
    G.doorLeftFrame = Math.min(15, G.doorLeftFrame + dt * 28);
  } else if (!G.doorLeftClosed && G.doorLeftFrame > 0) {
    G.doorLeftFrame = Math.max(0, G.doorLeftFrame - dt * 28);
  }

  if (G.doorRightClosed && G.doorRightFrame < 15) {
    G.doorRightFrame = Math.min(15, G.doorRightFrame + dt * 28);
  } else if (!G.doorRightClosed && G.doorRightFrame > 0) {
    G.doorRightFrame = Math.max(0, G.doorRightFrame - dt * 28);
  }

  // Clock Progression (60s per in-game hour, or 4s in FASTNIGHT cheat mode)
  const hourDuration = G.fastNight ? 4.0 : 60.0;
  G.timeSeconds += dt;
  const oldHour = G.hour;
  const elapsedHours = Math.floor(G.timeSeconds / hourDuration);
  if (elapsedHours === 0) G.hour = 12;
  else if (elapsedHours === 1) G.hour = 1;
  else if (elapsedHours === 2) G.hour = 2;
  else if (elapsedHours === 3) G.hour = 3;
  else if (elapsedHours === 4) G.hour = 4;
  else if (elapsedHours === 5) G.hour = 5;
  else {
    G.nightWon = true;
    G.gameState = 'win';
    G.hour = 6;
    G.winTimer = 0;
    stopAllShiftSounds();
    playSound('win');
    return;
  }

  if (G.hour !== oldHour) {
    updateAILevelsForHour();
  }

  // Power & 3-Stage Blackout System (Authentic FNaF 1 Scott Cawthon Formula)
  if (!G.blackout) {
    if (G.infinitePower) {
      G.power = 100.0;
    } else {
      G.usage = 1 + (G.doorLeftClosed ? 1 : 0) + (G.doorRightClosed ? 1 : 0) + (G.lightLeftOn ? 1 : 0) + (G.lightRightOn ? 1 : 0) + (G.monitorOpen ? 1 : 0);
      G.power -= 0.1 * G.usage * dt;
      if (G.power <= 0) {
        G.power = 0;
        G.blackout = true;
        G.blackoutStage = 1;
        G.blackoutStageTimer = 0;
        G.blackoutCheckTimer = 0;
        G.blackoutFreddyFlickerTimer = 0;
        G.blackoutFreddyFlickerState = 0;
        G.doorLeftClosed = false;
        G.doorRightClosed = false;
        G.lightLeftOn = false;
        G.lightRightOn = false;
        G.tabletState = 'closed';
        G.monitorOpen = false;
        stopAllShiftSounds();
        playSound('powerdown');
      }
    }
  } else {
    G.blackoutStageTimer += dt;
    G.blackoutCheckTimer += dt;

    if (G.blackoutStage === 1) {
      // Stage 1: Pitch black darkness. Every 5s, 20% roll to advance to Stage 2 (or max 20s)
      if (G.blackoutCheckTimer >= 5.0) {
        G.blackoutCheckTimer = 0;
        if (Math.random() < 0.20 || G.blackoutStageTimer >= 20.0) {
          G.blackoutStage = 2;
          G.blackoutStageTimer = 0;
          G.blackoutCheckTimer = 0;
          sounds.toreador_march.currentTime = 0;
          sounds.toreador_march.play().catch(()=>{});
        }
      } else if (G.blackoutStageTimer >= 20.0) {
        G.blackoutStage = 2;
        G.blackoutStageTimer = 0;
        G.blackoutCheckTimer = 0;
        sounds.toreador_march.currentTime = 0;
        sounds.toreador_march.play().catch(()=>{});
      }
    } else if (G.blackoutStage === 2) {
      // Stage 2: Toreador March music box + Freddy face flickering in left doorway
      G.blackoutFreddyFlickerTimer += dt;
      if (G.blackoutFreddyFlickerTimer >= 0.18) {
        G.blackoutFreddyFlickerTimer = 0;
        const rnd = Math.random();
        G.blackoutFreddyFlickerState = (rnd < 0.45) ? 0 : ((rnd < 0.75) ? 1 : 2);
      }

      // Every 5s, 20% roll to advance to Stage 3 (or max 20s)
      if (G.blackoutCheckTimer >= 5.0) {
        G.blackoutCheckTimer = 0;
        if (Math.random() < 0.20 || G.blackoutStageTimer >= 20.0) {
          G.blackoutStage = 3;
          G.blackoutStageTimer = 0;
          G.blackoutCheckTimer = 0;
          sounds.toreador_march.pause();
          playSound('metallic_footsteps');
        }
      } else if (G.blackoutStageTimer >= 20.0) {
        G.blackoutStage = 3;
        G.blackoutStageTimer = 0;
        G.blackoutCheckTimer = 0;
        sounds.toreador_march.pause();
        playSound('metallic_footsteps');
      }
    } else if (G.blackoutStage === 3) {
      // Stage 3: Total darkness and footsteps. Every 2s, 20% roll to jumpscare (or max 20s)
      if (G.blackoutCheckTimer >= 2.0) {
        G.blackoutCheckTimer = 0;
        if (Math.random() < 0.20 || G.blackoutStageTimer >= 20.0) {
          sounds.toreador_march.pause();
          triggerJumpscare('maler_blackout', 'Maler (Blackout Power Loss)');
          return;
        }
      } else if (G.blackoutStageTimer >= 20.0) {
        sounds.toreador_march.pause();
        triggerJumpscare('maler_blackout', 'Maler (Blackout Power Loss)');
        return;
      }
    }

    // Office panning during blackout
    let target = -240;
    if (G.mouseX < 500) {
      const f = Math.max(0, (500 - G.mouseX) / 500);
      target = -240 + f * 240;
    } else if (G.mouseX > 1420) {
      const f = Math.max(0, (G.mouseX - 1420) / 500);
      target = -240 - f * 240;
    }
    G.panX += (target - G.panX) * Math.min(1, dt * 7);
    G.staticFrame = (Math.floor(performance.now() / 45) % 6) + 1;
    return;
  }

  // Office Edge Panning
  if (G.tabletState === 'closed') {
    let target = -240;
    if (G.mouseX < 500) {
      const f = Math.max(0, (500 - G.mouseX) / 500);
      target = -240 + f * 240;
    } else if (G.mouseX > 1420) {
      const f = Math.max(0, (G.mouseX - 1420) / 500);
      target = -240 - f * 240;
    }
    G.panX += (target - G.panX) * Math.min(1, dt * 7);
  }

  // Entity 5 (Golden Freddy) in Office
  if (G.entity5.active && G.tabletState === 'closed') {
    G.entity5.timer += dt;
    if (G.entity5.timer > 1.2) {
      triggerJumpscare('entity5', 'Entity 5 (Golden Freddy Phantasm)');
      return;
    }
  }

  // Static Animation Frame
  G.staticFrame = (Math.floor(performance.now() / 45) % 6) + 1;

  // =======================================================================
  // INDEPENDENT ENEMY MOVEMENT OPPORTUNITY ENGINE (SCOTT CAWTHON AUTHENTIC)
  // =======================================================================

  // 1. Karkas (Bonnie) Cadence: 4.97 seconds with Authentic Wandering, Retreat Cooldown & Movement Opportunity
  if (G.karkas.retreatCooldown > 0) {
    G.karkas.retreatCooldown -= dt;
  }
  G.karkas.tickTimer -= dt;
  if (G.karkas.tickTimer <= 0) {
    G.karkas.tickTimer = 4.97;
    if (G.karkas.level > 0 && G.karkas.retreatCooldown <= 0 && checkMovementOpportunity(G.karkas.level)) {
      let moved = false;
      if (G.karkas.pos === 1) {
        // Stage -> Dining (65%) or Backstage (35%)
        G.karkas.pos = (Math.random() < 0.65) ? 2 : 3;
        moved = true;
      } else if (G.karkas.pos === 2) {
        // Dining -> Backstage (35%), West Hall (35%), or stays in Dining (30%)
        const r = Math.random();
        if (r < 0.35) G.karkas.pos = 3;
        else if (r < 0.70) G.karkas.pos = 4;
        moved = true;
      } else if (G.karkas.pos === 3) {
        // Backstage -> Dining (70%) or West Hall (30%)
        G.karkas.pos = (Math.random() < 0.70) ? 2 : 4;
        moved = true;
      } else if (G.karkas.pos === 4) {
        // West Hall -> Wanders BACK to Dining (40%), Supply Closet (35%), or advances to Corner (25%)
        const r = Math.random();
        if (r < 0.40) G.karkas.pos = 2; // Wanders backward!
        else if (r < 0.75) G.karkas.pos = 5; // Closet
        else G.karkas.pos = 6; // Corner
        moved = true;
      } else if (G.karkas.pos === 5) {
        // Supply Closet -> Back to West Hall (60%) or Corner (40%)
        G.karkas.pos = (Math.random() < 0.60) ? 4 : 6;
        moved = true;
      } else if (G.karkas.pos === 6) {
        // Corner -> Wanders BACK to West Hall/Closet (45%) or advances to Door Blindspot (55%)
        const r = Math.random();
        if (r < 0.45) {
          G.karkas.pos = (Math.random() < 0.5) ? 4 : 5; // Wanders backward!
        } else {
          G.karkas.pos = 7; // Blindspot / Window
          G.karkas.blindspotTimer = 0;
          if (G.lightLeftOn) {
            playSound('windowscare');
          }
        }
        moved = true;
      } else if (G.karkas.pos === 7) {
        // AT DOOR BLINDSPOT (Governed strictly by Movement Opportunity!)
        if (G.doorLeftClosed) {
          // Door is closed: Bonnie retreats quietly! NO loud metallic pounding sound!
          G.karkas.pos = (Math.random() < 0.6) ? 2 : 3; // Retreats back to Dining Area or Backstage
          G.karkas.retreatCooldown = 18.0 + Math.random() * 8.0; // Fair breathing room (18-26s)
          G.karkas.blindspotTimer = 0;
          moved = true;
        } else {
          // Door is open: Bonnie enters office!
          G.karkas.inOffice = true;
          G.leftButtonsJammed = true;
          moved = true;
        }
      }

      if (moved) {
        G.globalMovementCooldown = 1.2;
      }
    }
  }

  // 2. Plague (Chica) Cadence: 4.98 seconds with Kitchen Lingering, Wandering & Movement Opportunity
  if (G.plague.retreatCooldown > 0) {
    G.plague.retreatCooldown -= dt;
  }
  G.plague.tickTimer -= dt;
  if (G.plague.tickTimer <= 0) {
    G.plague.tickTimer = 4.98;
    if (G.plague.level > 0 && G.plague.retreatCooldown <= 0 && checkMovementOpportunity(G.plague.level)) {
      let moved = false;
      if (G.plague.pos === 1) {
        // Stage -> Dining
        G.plague.pos = 2;
        moved = true;
      } else if (G.plague.pos === 2) {
        // Dining -> Kitchen (45%), Restrooms (35%), East Hall (20%)
        const r = Math.random();
        if (r < 0.45) G.plague.pos = 4;
        else if (r < 0.80) G.plague.pos = 3;
        else G.plague.pos = 5;
        moved = true;
      } else if (G.plague.pos === 3) {
        // Restrooms -> Kitchen (50%), Dining (30%), East Hall (20%)
        const r = Math.random();
        if (r < 0.50) G.plague.pos = 4;
        else if (r < 0.80) G.plague.pos = 2;
        else G.plague.pos = 5;
        moved = true;
      } else if (G.plague.pos === 4) {
        // Kitchen -> Chica loves lingering in kitchen clattering pots!
        const r = Math.random();
        if (r < 0.55) {
          // Lingers in Kitchen
        } else if (r < 0.80) {
          G.plague.pos = 5; // East Hall
          moved = true;
        } else {
          G.plague.pos = 3; // Restrooms
          moved = true;
        }
      } else if (G.plague.pos === 5) {
        // East Hall -> Wanders BACK to Kitchen (40%), Dining (20%), or Corner (40%)
        const r = Math.random();
        if (r < 0.40) G.plague.pos = 4; // Wanders backward!
        else if (r < 0.60) G.plague.pos = 2; // Wanders backward!
        else G.plague.pos = 6; // Corner
        moved = true;
      } else if (G.plague.pos === 6) {
        // Corner -> Wanders BACK to East Hall (45%) or advances to Door Blindspot (55%)
        const r = Math.random();
        if (r < 0.45) {
          G.plague.pos = 5; // Wanders backward!
        } else {
          G.plague.pos = 7; // Blindspot / Window
          G.plague.blindspotTimer = 0;
          if (G.lightRightOn) {
            playSound('windowscare');
          }
        }
        moved = true;
      } else if (G.plague.pos === 7) {
        // AT DOOR BLINDSPOT (Governed strictly by Movement Opportunity!)
        if (G.doorRightClosed) {
          // Door is closed: Chica retreats quietly! NO loud metallic pounding sound!
          G.plague.pos = (Math.random() < 0.55) ? 4 : 3; // Retreats back to Kitchen or Restrooms
          G.plague.retreatCooldown = 18.0 + Math.random() * 8.0; // Fair breathing room (18-26s)
          G.plague.blindspotTimer = 0;
          moved = true;
        } else {
          // Door is open: Chica enters office!
          G.plague.inOffice = true;
          G.rightButtonsJammed = true;
          moved = true;
        }
      }

      if (moved) {
        G.globalMovementCooldown = 1.2;
      }
    }
  }

  // 3. Maler (Freddy) Cadence: 3.02 seconds (Frozen when camera is watched)
  G.maler.tickTimer -= dt;
  if (G.maler.stallTimer > 0) G.maler.stallTimer -= dt;

  const malerCamWatched = G.monitorOpen && (
    (G.maler.pos === 1 && G.selectedCam === '1A') ||
    (G.maler.pos === 2 && G.selectedCam === '1B') ||
    (G.maler.pos === 3 && G.selectedCam === '7')  ||
    (G.maler.pos === 4 && G.selectedCam === '6')  ||
    (G.maler.pos === 5 && G.selectedCam === '4A') ||
    (G.maler.pos === 6 && G.selectedCam === '4B')
  );
  if (malerCamWatched) {
    G.maler.stallTimer = 2.0;
  }

  if (G.maler.tickTimer <= 0) {
    G.maler.tickTimer = 3.02;
    if (!malerCamWatched && G.maler.stallTimer <= 0 && G.maler.level > 0 && checkMovementOpportunity(G.maler.level)) {
      if (G.maler.pos < 6) {
        G.maler.pos++;
        playSound('maler_laugh');
        G.globalMovementCooldown = 1.2;
      } else if (G.maler.pos === 6) {
        if (G.doorRightClosed) {
          playSound('door_pound');
          G.maler.pos = 5; // Repelled back to East Hall
          G.maler.stallTimer = 14.0; // 14s stall
          G.globalMovementCooldown = 1.2;
        } else if (!G.monitorOpen) {
          triggerJumpscare('maler', 'Maler (East Hall Corner Infiltration)');
          return;
        }
      }
    }
  }

  // 4. Dash (Foxy) Cadence: 5.01 seconds with Global Monitor Stalling & Long Recovery
  G.dash.tickTimer -= dt;
  if (G.dash.stallTimer > 0) G.dash.stallTimer -= dt;

  // Looking at ANY camera monitor stalls Foxy! Watching Pirate Cove adds massive stall!
  if (G.monitorOpen) {
    if (G.selectedCam === '1C') {
      if (G.dash.stallTimer < 8.0) G.dash.stallTimer = 8.0 + Math.random() * 6.0;
    } else {
      if (G.dash.stallTimer < 1.5) G.dash.stallTimer = 1.5;
    }
  }

  if (G.dash.tickTimer <= 0) {
    G.dash.tickTimer = 5.01;
    if (G.dash.stallTimer <= 0 && G.dash.level > 0 && G.dash.stage < 4 && checkMovementOpportunity(G.dash.level)) {
      G.dash.stage++;
      G.globalMovementCooldown = 1.2;
      if (G.dash.stage === 4) {
        playSound('dash_sprint');
        G.dash.sprintTimer = 0;
      }
    }
  }

  // Dash Sprinting Phase (Fair 3.5s sprint reaction window)
  if (G.dash.stage === 4) {
    G.dash.sprintTimer += dt;
    if (G.dash.sprintTimer >= 3.5) {
      if (G.doorLeftClosed) {
        playSound('door_pound');
        const drain = (G.dash.drainCount ? 6 : 1);
        if (!G.infinitePower) G.power = Math.max(0, G.power - drain);
        G.dash.drainCount = (G.dash.drainCount || 0) + 1;
        G.dash.stage = 1;
        G.dash.sprintTimer = 0;
        G.dash.stallTimer = 16.0; // 16s cooldown after door impact!
      } else {
        triggerJumpscare('dash', 'Dash (The Sprinter)');
        return;
      }
    }
  }

  // In-Office Infiltration Watchdog (If player leaves monitor down after animatronic slipped in)
  if (G.karkas.inOffice) {
    G.karkas.officeTimer = (G.karkas.officeTimer || 0) + dt;
    if (G.karkas.officeTimer >= 6.0 && G.tabletState === 'closed') {
      triggerJumpscare('karkas', 'Karkas (Infiltrated Office)');
      return;
    }
  }
  if (G.plague.inOffice) {
    G.plague.officeTimer = (G.plague.officeTimer || 0) + dt;
    if (G.plague.officeTimer >= 6.0 && G.tabletState === 'closed') {
      triggerJumpscare('plague', 'Plague (Infiltrated Office)');
      return;
    }
  }
}

// =========================================================================
// 8. RENDER ENGINE (1920x1080 FULL HD)
// =========================================================================
function render() {
  ctx.clearRect(0, 0, 1920, 1080);

  // 1. AUTHENTIC FNAF 1 MAIN MENU RENDER
  if (G.gameState === 'menu') {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, 1920, 1080);

    const fImg = images['menu_freddy_' + G.menuFreddyFrame];
    if (fImg && fImg.complete) {
      let jx = 0;
      if (G.menuTwitchActive) jx = (Math.random() - 0.5) * 20;
      ctx.drawImage(fImg, jx, 0, 1920, 1080);
    }

    const sImg = images['static' + G.staticFrame];
    if (sImg && sImg.complete) {
      ctx.globalAlpha = 0.22 + (G.menuTwitchActive ? 0.25 : 0);
      ctx.drawImage(sImg, 0, 0, 1920, 1080);
      ctx.globalAlpha = 1.0;
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = '84px SpecialElite, monospace';
    ctx.fillText('Five', 140, 200);
    ctx.fillText('Nights', 140, 290);
    ctx.fillText('at', 140, 380);
    ctx.fillStyle = '#ff2222';
    ctx.fillText('Maler', 140, 480);

    // Stars earned display (★, ★★, ★★★) with authentic golden glow
    if (G.saveData.stars > 0) {
      ctx.save();
      ctx.font = '48px Consolas, FnafConsolas, monospace';
      ctx.fillStyle = '#ffe066';
      ctx.shadowColor = '#ffbb00';
      ctx.shadowBlur = 14;
      for (let i = 0; i < G.saveData.stars; i++) {
        ctx.fillText('★', 140 + i * 55, 560);
      }
      ctx.restore();
    }

    // Dynamic Menu Options
    const menuItems = getAvailableMenuItems();
    for (let idx = 0; idx < menuItems.length; idx++) {
      const item = menuItems[idx];
      const isSelected = (G.selectedMenuOption === idx);
      const topY = 620 + idx * 75;

      ctx.font = '50px SpecialElite, monospace';
      if (isSelected) {
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`>> ${item.label}`, 120, topY + 45);
      } else {
        ctx.fillStyle = '#888888';
        ctx.fillText(`   ${item.label}`, 120, topY + 45);
      }

      ctx.font = '26px VT323, monospace';
      ctx.fillStyle = isSelected ? '#ff4444' : '#555555';
      ctx.fillText(`${item.sub}`, 460, topY + 40);
    }

    ctx.font = '26px VT323, monospace';
    ctx.fillStyle = '#555555';
    ctx.fillText('v 2.00 (Cryptographic Save Vault & Extra Active)', 80, 1040);
    ctx.textAlign = 'right';
    ctx.fillText('© 2026 Scott Cawthon / Maler Fazbear Entertainment', 1840, 1040);
    return;
  }

  // 2. CUSTOM NIGHT (NIGHT 7) SCREEN RENDER
  if (G.gameState === 'custom_night') {
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, 1920, 1080);

    const sImg = images['static' + G.staticFrame];
    if (sImg && sImg.complete) {
      ctx.globalAlpha = 0.15;
      ctx.drawImage(sImg, 0, 0, 1920, 1080);
      ctx.globalAlpha = 1.0;
    }

    ctx.textAlign = 'center';
    ctx.font = '72px SpecialElite, monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('CUSTOM NIGHT', 960, 100);

    ctx.font = '32px VT323, monospace';
    ctx.fillStyle = '#888888';
    ctx.fillText('НАСТРОЙКА УРОВНЕЙ ИСКУССТВЕННОГО ИНТЕЛЛЕКТА (0 - 20)', 960, 145);

    const cards = [
      { key: 'maler',  name: 'Maler',  sub: 'Freddy analog', img: images.custom_freddy, x: 140, color: '#c28544' },
      { key: 'karkas', name: 'Karkas', sub: 'Bonnie analog', img: images.custom_bonnie, x: 540, color: '#6866b8' },
      { key: 'plague', name: 'Plague', sub: 'Chica analog',  img: images.custom_chica,  x: 940, color: '#cccc33' },
      { key: 'dash',   name: 'Dash',   sub: 'Foxy analog',   img: images.custom_foxy,   x: 1340, color: '#c23333' }
    ];

    for (const c of cards) {
      ctx.fillStyle = 'rgba(20, 20, 25, 0.85)';
      ctx.fillRect(c.x, 190, 340, 520);
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 3;
      ctx.strokeRect(c.x, 190, 340, 520);

      if (c.img && c.img.complete) {
        ctx.drawImage(c.img, c.x + 70, 220, 200, 200);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(c.x + 70, 220, 200, 200);
      }
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.strokeRect(c.x + 70, 220, 200, 200);

      ctx.textAlign = 'center';
      ctx.font = '46px SpecialElite, monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(c.name, c.x + 170, 470);

      ctx.font = '24px VT323, monospace';
      ctx.fillStyle = '#777777';
      ctx.fillText(c.sub, c.x + 170, 505);

      function wrapText(text, x, y, maxWidth, lineHeight, font, fillStyle) {
        ctx.font = font;
        ctx.fillStyle = fillStyle;
        const words = text.split(' ');
        let line = '';
        let curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, curY);
            line = words[n] + ' ';
            curY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, curY);
        return curY + lineHeight;
      }

      let textY = 345;
      ctx.font = '28px VT323, monospace';
      ctx.fillStyle = '#00e5ff';
      ctx.fillText('[КАДЕНЦИЯ И ТАЙМИНГ ПРОВЕРОК]', 780, textY);
      textY = wrapText(selAnim.cadence, 780, textY + 35, 980, 32, '26px VT323, monospace', '#cccccc');

      textY += 15;
      ctx.font = '28px VT323, monospace';
      ctx.fillStyle = '#ffd700';
      ctx.fillText('[МАРШРУТ ПЕРЕМЕЩЕНИЯ]', 780, textY);
      textY = wrapText(selAnim.route, 780, textY + 35, 980, 32, '26px VT323, monospace', '#cccccc');

      textY += 15;
      ctx.font = '28px VT323, monospace';
      ctx.fillStyle = '#ff5577';
      ctx.fillText('[ПОВЕДЕНИЕ И AI ШАБЛОН]', 780, textY);
      textY = wrapText(selAnim.behavior, 780, textY + 35, 980, 32, '26px VT323, monospace', '#cccccc');

      textY += 15;
      ctx.font = '28px VT323, monospace';
      ctx.fillStyle = '#55ff77';
      ctx.fillText('[КОНТРМЕРЫ И СТРАТЕГИЯ ВЫЖИВАНИЯ]', 780, textY);

    if (G.cheatToastTimer > 0) {

      ctx.fillStyle = '#00ff44';

  // 4. SHIFT INTRO SCREEN (12:00 AM)

    // Camera Minimap Floorplan (Clean Authentic FNaF 1 Map)

    for (const b of camButtons) {

      if (borderImg && borderImg.complete) {

      // Draw inside text plate
      const plateImg = images['plate_' + b.plate];

    if (G.radarActive) {

        maler: { 1: '1A', 2: '1B', 3: '7', 4: '6', 5: '4A', 6: '4B' },

      ctx.fillText(`TIME: ${(G.hour === 0 ? 12 : G.hour)}:00 AM | PWR: ${G.infinitePower ? 'INF' : Math.ceil(G.power) + '%'}`, mx0 + mw - 180, my0 + 50);

      // Top-right Close Button [X]
      const hoverCloseX = (G.mouseX >= mx0 + mw - 60 && G.mouseX <= mx0 + mw - 20 && G.mouseY >= my0 + 15 && G.mouseY <= my0 + 52);
      ctx.fillStyle = hoverCloseX ? '#ff2255' : '#1e2638';
      ctx.fillRect(mx0 + mw - 60, my0 + 15, 40, 37);
      ctx.strokeStyle = hoverCloseX ? '#ffffff' : '#334460';
      ctx.lineWidth = 1;
      ctx.strokeRect(mx0 + mw - 60, my0 + 15, 40, 37);
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px Consolas, monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('×', mx0 + mw - 40, my0 + 39);

      // Tab Bar (y: 155..215, h = 60)
      const tabNames = [
        { id: 0, icon: '🤖', title: 'AIMBOT / A.I.' },
        { id: 1, icon: '👁️', title: 'VISUALS / ESP' },
        { id: 2, icon: '⚡', title: 'MISC / SYSTEM' },
        { id: 3, icon: '💀', title: 'SPAWNS / EXPLOITS' }
      ];

      for (let t = 0; t < 4; t++) {
        const item = tabNames[t];
        const tx = mx0 + 20 + t * 290;
        const ty = my0 + 75;
        const tw = 280;
        const th = 46;
        const isSel = (G.neverloseTab === t);
        const isHover = (G.mouseX >= tx && G.mouseX <= tx + tw && G.mouseY >= ty && G.mouseY <= ty + th);

        ctx.fillStyle = isSel ? '#131e33' : (isHover ? '#0f1726' : '#090e18');
        ctx.fillRect(tx, ty, tw, th);
        ctx.strokeStyle = isSel ? '#00e5ff' : (isHover ? '#3a4e70' : '#1c283c');
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.strokeRect(tx, ty, tw, th);

        if (isSel) {
          ctx.fillStyle = '#00e5ff';
          ctx.fillRect(tx, ty + th - 3, tw, 3);
        }

        ctx.textAlign = 'center';
        ctx.font = 'bold 18px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = isSel ? '#ffffff' : (isHover ? '#ccddee' : '#687c98');
        ctx.fillText(`${item.icon} ${item.title}`, tx + tw / 2, ty + 28);
      }

      // Groupboxes layout (y: 235..755, h = 520)
      const gbY = my0 + 135;
      const gbH = 515;
      const leftGbX = mx0 + 20, leftGbW = 570;
      const rightGbX = mx0 + 610, rightGbW = 570;

      function drawNeverloseGroupBox(gx, gy, gw, gh, header) {
        ctx.fillStyle = '#0b101c';
        ctx.fillRect(gx, gy, gw, gh);
        ctx.strokeStyle = '#1a263d';
        ctx.lineWidth = 1;
        ctx.strokeRect(gx, gy, gw, gh);

        // Header line
        ctx.fillStyle = '#0f1728';
        ctx.fillRect(gx, gy, gw, 36);
        ctx.strokeStyle = '#1f2e4a';
        ctx.beginPath();
        ctx.moveTo(gx, gy + 36);
        ctx.lineTo(gx + gw, gy + 36);
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 15px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = '#00e5ff';
        ctx.fillText(header, gx + 16, gy + 24);
      }

      function drawNeverloseToggle(x, y, w, h, label, active) {
        const hover = (G.mouseX >= x && G.mouseX <= x + w && G.mouseY >= y && G.mouseY <= y + h);
        ctx.fillStyle = hover ? '#131c2e' : '#0d1320';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = active ? '#00e5ff' : (hover ? '#3b4e70' : '#1c283c');
        ctx.lineWidth = active ? 2 : 1;
        ctx.strokeRect(x, y, w, h);

        ctx.textAlign = 'left';
        ctx.font = '16px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = active ? '#ffffff' : '#99aacc';
        ctx.fillText(label, x + 16, y + h / 2 + 5);

        // Switch pill
        const swW = 60, swH = 26;
        const swX = x + w - swW - 14, swY = y + (h - swH) / 2;
        ctx.fillStyle = active ? '#00e5ff' : '#182236';
        ctx.fillRect(swX, swY, swW, swH);
        ctx.strokeStyle = active ? '#ffffff' : '#2d3e5e';
        ctx.strokeRect(swX, swY, swW, swH);

        ctx.textAlign = 'center';
        ctx.font = 'bold 13px Consolas, monospace';
        ctx.fillStyle = active ? '#000000' : '#778899';
        ctx.fillText(active ? 'ON' : 'OFF', swX + swW / 2, swY + 18);
      }

      function drawNeverloseActionBtn(x, y, w, h, label, color) {
        const hover = (G.mouseX >= x && G.mouseX <= x + w && G.mouseY >= y && G.mouseY <= y + h);
        ctx.fillStyle = hover ? '#182438' : '#0e1524';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = hover ? color : '#243550';
        ctx.lineWidth = hover ? 2 : 1;
        ctx.strokeRect(x, y, w, h);

        ctx.textAlign = 'center';
        ctx.font = 'bold 16px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = hover ? '#ffffff' : color;
        ctx.fillText(label, x + w / 2, y + h / 2 + 5);
      }

      // TAB 0: AIMBOT / A.I. ENGINE
      if (G.neverloseTab === 0) {
        drawNeverloseGroupBox(leftGbX, gbY, leftGbW, gbH, 'A.I. CALIBRATION & INDEPENDENT CADENCE');

        const aiRobots = [
          { name: 'Maler (Freddy)', level: G.maler.level, y: gbY + 55, color: '#c28544' },
          { name: 'Karkas (Bonnie)', level: G.karkas.level, y: gbY + 125, color: '#6866b8' },
          { name: 'Plague (Chica)', level: G.plague.level, y: gbY + 195, color: '#cccc33' },
          { name: 'Dash (Foxy)', level: G.dash.level, y: gbY + 265, color: '#c23333' }
        ];

        for (const bot of aiRobots) {
          ctx.fillStyle = '#0d1320';
          ctx.fillRect(leftGbX + 16, bot.y, leftGbW - 32, 54);
          ctx.strokeStyle = '#1d2a42';
          ctx.strokeRect(leftGbX + 16, bot.y, leftGbW - 32, 54);

          ctx.textAlign = 'left';
          ctx.font = 'bold 17px Consolas, FnafConsolas, monospace';
          ctx.fillStyle = bot.color;
          ctx.fillText(bot.name, leftGbX + 32, bot.y + 33);

          // Minus Button
          const hoverM = (G.mouseX >= 780 && G.mouseX <= 830 && G.mouseY >= bot.y + 8 && G.mouseY <= bot.y + 46);
          ctx.fillStyle = hoverM ? '#26344d' : '#141d2e';
          ctx.fillRect(780, bot.y + 8, 50, 38);
          ctx.strokeStyle = hoverM ? '#00e5ff' : '#283852';
          ctx.strokeRect(780, bot.y + 8, 50, 38);
          ctx.textAlign = 'center';
          ctx.font = 'bold 22px Consolas, monospace';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('-', 805, bot.y + 33);

          // Level Value
          ctx.font = 'bold 22px Consolas, monospace';
          ctx.fillStyle = bot.level === 20 ? '#ff3344' : (bot.level === 0 ? '#00ff88' : '#ffffff');
          ctx.fillText(bot.level, 840, bot.y + 34);

          // Plus Button
          const hoverP = (G.mouseX >= 850 && G.mouseX <= 900 && G.mouseY >= bot.y + 8 && G.mouseY <= bot.y + 46);
          ctx.fillStyle = hoverP ? '#26344d' : '#141d2e';
          ctx.fillRect(850, bot.y + 8, 50, 38);
          ctx.strokeStyle = hoverP ? '#00e5ff' : '#283852';
          ctx.strokeRect(850, bot.y + 8, 50, 38);
          ctx.textAlign = 'center';
          ctx.font = 'bold 22px Consolas, monospace';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('+', 875, bot.y + 34);
        }

        ctx.textAlign = 'left';
        ctx.font = '14px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = '#556885';
        ctx.fillText('* AI Opportunity: Roll [1..20] <= Effective_AI (Nerfed < 15)', leftGbX + 20, gbY + 360);
        ctx.fillText('* Grace timer: 16.0s start | Lockout: 1.2s | Retreat: 18-26s', leftGbX + 20, gbY + 390);

        drawNeverloseGroupBox(rightGbX, gbY, rightGbW, gbH, 'A.I. PRESETS & OVERRIDES');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 55, rightGbW - 40, 52, '🔥 [ 20 / 20 / 20 / 20 ] NIGHTMARE ALL-MAX', '#ff3344');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 125, rightGbW - 40, 52, '⚡ [ 10 / 10 / 10 / 10 ] HARD BALANCED PRESET', '#ddaa33');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 195, rightGbW - 40, 52, '🛡️ [ 00 / 00 / 00 / 00 ] PACIFIST SAFE SANCTUARY', '#00ff88');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 265, rightGbW - 40, 52, '🛑 RESET ALL ANIMATRONICS TO STAGE / COVE', '#00e5ff');
      }

      // TAB 1: VISUALS / RADAR ESP
      if (G.neverloseTab === 1) {
        drawNeverloseGroupBox(leftGbX, gbY, leftGbW, gbH, 'SURVEILLANCE & ESP OVERLAYS');
        drawNeverloseToggle(leftGbX + 20, gbY + 55, leftGbW - 40, 54, '📡 RADAR ESP MINIMAP ENTITY OVERLAY', G.radarActive);
        drawNeverloseToggle(leftGbX + 20, gbY + 125, leftGbW - 40, 54, '🚪 BLINDSPOT WINDOW SENSORS', (G.karkas.pos === 7 || G.plague.pos === 7));

        ctx.textAlign = 'left';
        ctx.font = '14px Consolas, FnafConsolas, monospace';
        ctx.fillStyle = '#687c98';
        ctx.fillText('Telemetry status: Visual highlights on cameras & blinds.', leftGbX + 22, gbY + 215);

        drawNeverloseGroupBox(rightGbX, gbY, rightGbW, gbH, 'PARANORMAL & EASTER EGG TRIGGERS');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 55, rightGbW - 40, 52, '🎭 TRIGGER "IT\'S ME" PSYCHEDELIC FLASH', '#ff33ff');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 125, rightGbW - 40, 52, '📰 SPAWN CAM 4B NEWSPAPER CLIPPING', '#00e5ff');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 195, rightGbW - 40, 52, '🖼️ SPAWN CAM 2B GOLDEN FREDDY POSTER', '#ffd700');
      }

      // TAB 2: MISC / SYSTEM
      if (G.neverloseTab === 2) {
        drawNeverloseGroupBox(leftGbX, gbY, leftGbW, gbH, 'POWER GENERATOR & HARDWARE');
        drawNeverloseToggle(leftGbX + 20, gbY + 55, leftGbW - 40, 54, '⚡ INFINITE POWER (100% CONSTANT)', G.infinitePower);
        drawNeverloseActionBtn(leftGbX + 20, gbY + 125, leftGbW - 40, 52, '🌑 TEST BLACKOUT (DRAIN TO 0% POWER)', '#ff3344');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 195, leftGbW - 40, 52, '🔋 RECHARGE BATTERY TO 100%', '#00ff88');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 265, leftGbW - 40, 52, '🔓 UNJAM ALL DOOR & LIGHT BUTTON PANELS', '#00e5ff');

        drawNeverloseGroupBox(rightGbX, gbY, rightGbW, gbH, 'TIMELINE & SHIFT ENGINE');
        drawNeverloseToggle(rightGbX + 20, gbY + 55, rightGbW - 40, 54, '⏩ FAST NIGHT SPEEDHACK (10x TIME)', G.fastNight);
        drawNeverloseActionBtn(rightGbX + 20, gbY + 125, rightGbW - 40, 52, '🏆 FAST-FORWARD TO 6:00 AM (INSTANT WIN)', '#00ff88');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 195, rightGbW - 40, 52, '⏰ SKIP +1 IN-GAME HOUR', '#00e5ff');
      }

      // TAB 3: SPAWNS / EXPLOITS
      if (G.neverloseTab === 3) {
        drawNeverloseGroupBox(leftGbX, gbY, leftGbW, gbH, 'DIRECT ENTITY INJECTION');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 55, leftGbW - 40, 52, '👻 MATERIALIZE GOLDEN FREDDY IN OFFICE', '#ffd700');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 125, leftGbW - 40, 52, '🚪 TELEPORT BONNIE TO LEFT DOOR (BLINDSPOT)', '#a080ff');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 195, leftGbW - 40, 52, '🚪 TELEPORT CHICA TO RIGHT DOOR (BLINDSPOT)', '#ffff44');
        drawNeverloseActionBtn(leftGbX + 20, gbY + 265, leftGbW - 40, 52, '🏃 FORCE FOXY SPRINT (STAGE 4 RUN)', '#ff3344');

        drawNeverloseGroupBox(rightGbX, gbY, rightGbW, gbH, 'AUDIO STINGERS & MUSIC BOX');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 55, rightGbW - 40, 52, '🔊 PLAY GOLDEN FREDDY SCREAM (9.35s)', '#ffd700');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 125, rightGbW - 40, 52, '🎵 PLAY TOREADOR MARCH MUSIC BOX', '#00e5ff');
        drawNeverloseActionBtn(rightGbX + 20, gbY + 195, rightGbW - 40, 52, '🚪 PLAY METALLIC DOOR POUND SOUND', '#ffffff');
      }

      // Footer Telemetry Bar (y: 770..830)
      ctx.fillStyle = '#060a12';
      ctx.fillRect(mx0 + 20, my0 + mh - 130, mw - 40, 48);
      ctx.strokeStyle = '#1b263b';
      ctx.lineWidth = 1;
      ctx.strokeRect(mx0 + 20, my0 + mh - 130, mw - 40, 48);

      ctx.textAlign = 'center';
      ctx.font = '15px Consolas, FnafConsolas, monospace';
      ctx.fillStyle = '#00e5ff';
      ctx.fillText(`ENTITIES: Maler: CAM ${G.maler.pos} | Karkas: CAM ${G.karkas.pos} | Plague: CAM ${G.plague.pos} | Dash: Stage ${G.dash.stage}/4 | GF: ${G.entity5.active ? 'IN OFFICE' : 'DORMANT'}`, mx0 + mw / 2, my0 + mh - 100);

      // Bottom Close Bar Button (x: 660, y: 865, w: 600, h: 50)
      const hoverBottomClose = (G.mouseX >= 660 && G.mouseX <= 1260 && G.mouseY >= 865 && G.mouseY <= 915);
      ctx.fillStyle = hoverBottomClose ? '#2b101c' : '#140c14';
      ctx.fillRect(660, 865, 600, 50);
      ctx.strokeStyle = hoverBottomClose ? '#ff3366' : '#701b2e';
      ctx.lineWidth = 2;
      ctx.strokeRect(660, 865, 600, 50);

      ctx.textAlign = 'center';
      ctx.font = 'bold 18px Consolas, FnafConsolas, monospace';
      ctx.fillStyle = hoverBottomClose ? '#ffffff' : '#ff4466';
      ctx.fillText('✕ CLOSE NEVERLOSE MENU [ESC / C]', 960, 897);
    }
  }
}

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// Initial Kick-off
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
