<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Five Nights at Freddy's - Authentic FNaF 1 HD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'VT323', monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    @font-face {
      font-family: 'VT323';
      src: url('assets/fonts/VT323-Regular.ttf');
    }
    @font-face {
      font-family: 'Creepster';
      src: url('assets/fonts/Creepster-Regular.ttf');
    }
    @font-face {
      font-family: 'SpecialElite';
      src: url('assets/fonts/SpecialElite-Regular.ttf');
    }
    @font-face {
      font-family: 'Consolas';
      src: url('assets/fonts/Inconsolata-Bold.ttf');
      font-weight: bold;
    }
    @font-face {
      font-family: 'FnafConsolas';
      src: url('assets/fonts/Inconsolata-Bold.ttf');
      font-weight: bold;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 Aspect Ratio */
      background: #000;
      box-shadow: 0 0 80px rgba(0,0,0,1);
      cursor: crosshair;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.02));
      background-size: 100% 4px, 8px 100%;
      z-index: 999;
    }
  </style>
</head>
<body>
<div id="game-container">
  <div class="crt-overlay"></div>
  <canvas id="gameCanvas" width="1920" height="1080"></canvas>
</div>

<!-- Modular Game Engine Scripts -->
<script src="src/save.js"></script>
<script src="src/audio.js"></script>
<script src="src/state.js"></script>
<script src="src/ai.js"></script>
<script src="src/office.js"></script>
<script src="src/render.js"></script>
<script src="src/game.js"></script>
</body>
</html>
